[package]
name = "viento-bevy-behaviors"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Generated headless Bevy project with registered Viento Rust behaviors"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
