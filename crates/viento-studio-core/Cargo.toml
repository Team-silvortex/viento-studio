[package]
name = "viento-studio-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Host-independent editing rules shared by Viento Studio frontends"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "viento-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
