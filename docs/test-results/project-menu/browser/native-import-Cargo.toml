[package]
name = "viento-project-pause-workspace-import"
version = "0.0.0"
edition = "2021"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1.25"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tempfile = "3"
fs2 = "0.4"
